spring:
  datasource:
    url: jdbc:h2:mem:testdb
  # H2 web console (http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    # transfer query check
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    # launch data.sql after create table
    defer-datasource-initialization: true
